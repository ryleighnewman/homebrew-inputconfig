name: Install problem
description: brew install or brew upgrade for InputConfig does not work
labels: [bug]
body:
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: The brew command you ran and everything it printed
      render: shell
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
    validations:
      required: true
